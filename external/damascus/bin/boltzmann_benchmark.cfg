//DaMaSCUS configuration for the Boltzmann-equation benchmark

//Simulation input parameter
		simID		=	"boltzmann_benchmark_5GeV_5e-32_vcut10_3m";
		initialruns	=	1000000L;
		samplesize	=	3000000;
		vcutoff		=	1.0e6;			//10 km/sec, in cm/sec
		rings		=	1;

//Simulation Time (not used for vEarth in BoltzmannBenchmark mode)
		date		=	[15,02,2016];
		time		=	[0,0,0];

//Dark Matter Data
		mass		=	5000.0;			//in MeV
		sigma		=	50000.0;		//in pb = 5e-32 cm^2
		formfactor	=	"None";

//DM Halo
		halomodel	=	"SHM";
		rho			=	0.3;			//in GeV/cm^3

//Earth and detector
		earthmodel	=	"BoltzmannBenchmark";
		depth		=	2400.0;			//in meter

//Analysis parameter
		experiment	=	"None";
